<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Premium Account Created</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
    }

    body{
        min-height:100vh;
        font-family:'Segoe UI',sans-serif;
        background:
          linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.80)),
          url('https://images.unsplash.com/photo-1601597111158-2fceff292cdc?auto=format&fit=crop&w=1600&q=80');
        background-size:cover;
        background-position:center;
        display:flex;
        justify-content:center;
        align-items:center;
        padding:20px;
    }

    .success-box{
        width:100%;
        max-width:520px;
        background:rgba(15,23,42,0.94);
        border-radius:28px;
        padding:34px;
        text-align:center;
        color:white;
        box-shadow:0 25px 60px rgba(0,0,0,0.55);
        border:1px solid rgba(255,255,255,0.08);
    }

    .icon{
        font-size:54px;
        margin-bottom:12px;
    }

    .title{
        font-size:32px;
        font-weight:800;
        color:#22c55e;
        margin-bottom:10px;
    }

    .subtitle{
        color:#cbd5e1;
        font-size:17px;
        margin-bottom:20px;
    }

    .account-card{
        background:rgba(255,255,255,0.05);
        border:1px solid rgba(255,255,255,0.08);
        border-radius:20px;
        padding:22px;
        margin:18px 0;
    }

    .label{
        color:#94a3b8;
        font-size:14px;
        margin-bottom:8px;
    }

    .acc-no{
        font-size:30px;
        font-weight:900;
        color:#38bdf8;
        letter-spacing:1px;
    }

    .login-btn{
        width:100%;
        border:none;
        padding:14px;
        border-radius:16px;
        font-size:17px;
        font-weight:700;
        background:linear-gradient(135deg,#2563eb,#38bdf8);
        color:white;
        text-decoration:none;
        display:inline-block;
        margin-top:10px;
    }

    .footer{
        margin-top:18px;
        color:#94a3b8;
        font-size:13px;
    }
  </style>
</head>

<body>

<div class="success-box">

  <div class="icon">🎉</div>

  <div class="title">Account Created Successfully</div>

  <div class="subtitle">
    Welcome, <strong th:text="${name}"></strong>
  </div>

  <div class="account-card">
    <div class="label">YOUR ACCOUNT NUMBER</div>
    <div class="acc-no" th:text="${accountNumber}"></div>
  </div>

  <a href="/login" class="login-btn">🔓 Go to Login</a>

  <div class="footer">
    ⚡ Smart • Secure • Instant Banking Access
  </div>

</div>

</body>
</html>
