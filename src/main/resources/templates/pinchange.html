<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Premium PIN Change</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
    }

    body{
        min-height:100vh;
        font-family:'Segoe UI',sans-serif;
        background:
          linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.78)),
          url('https://images.unsplash.com/photo-1614064641938-3bbee52942c7?auto=format&fit=crop&w=1600&q=80');
        background-size:cover;
        background-position:center;
        display:flex;
        justify-content:center;
        align-items:center;
        padding:20px;
    }

    .pin-box{
        width:100%;
        max-width:520px;
        background:rgba(15,23,42,0.92);
        border-radius:28px;
        padding:32px;
        color:white;
        box-shadow:0 25px 60px rgba(0,0,0,0.55);
        border:1px solid rgba(255,255,255,0.08);
    }

    .title{
        text-align:center;
        margin-bottom:8px;
        font-size:30px;
        font-weight:800;
        color:#e2e8f0;
    }

    .subtitle{
        text-align:center;
        color:#cbd5e1;
        margin-bottom:22px;
    }

    .status{
        background:rgba(148,163,184,0.12);
        border:1px solid rgba(148,163,184,0.25);
        color:#e2e8f0;
        padding:12px;
        border-radius:14px;
        text-align:center;
        margin-bottom:22px;
        font-weight:600;
    }

    .form-label{
        color:#e2e8f0;
        font-weight:600;
        margin-bottom:8px;
    }

    .form-control{
        background:#0f172a;
        border:1px solid #334155;
        color:white;
        border-radius:14px;
        padding:12px;
    }

    .form-control:focus{
        background:#0f172a;
        color:white;
        border-color:#94a3b8;
        box-shadow:0 0 0 0.2rem rgba(148,163,184,0.15);
    }

    .pin-btn{
        width:100%;
        border:none;
        padding:14px;
        border-radius:16px;
        font-size:17px;
        font-weight:700;
        background:linear-gradient(135deg,#1e293b,#475569);
        color:white;
        margin-top:8px;
        transition:0.25s ease;
    }

    .pin-btn:hover{
        transform:translateY(-2px);
    }

    .back-btn{
        width:100%;
        margin-top:12px;
        border-radius:16px;
        padding:12px;
        font-weight:700;
    }

    .message-box{
        margin-top:18px;
        background:rgba(34,197,94,0.12);
        border:1px solid rgba(34,197,94,0.2);
        padding:14px;
        border-radius:16px;
        text-align:center;
        font-weight:700;
    }

    .footer-note{
        text-align:center;
        color:#94a3b8;
        font-size:13px;
        margin-top:18px;
    }
  </style>
</head>

<body>

<div class="pin-box">

  <div class="title">🔐 Change PIN</div>
  <div class="subtitle">Secure PIN Management Terminal</div>

  <div class="status">
    🛡️ Security Verification Required
  </div>

  <form action="/pinchange" method="post">

    <div class="mb-3">
      <label class="form-label">Account Number</label>
      <input type="number" name="accountNumber" class="form-control" placeholder="Enter account number" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Old PIN</label>
      <input type="password" name="oldPin" class="form-control" placeholder="Enter current PIN" required>
    </div>

    <div class="mb-3">
      <label class="form-label">New PIN</label>
      <input type="password" name="newPin" class="form-control" placeholder="Enter new PIN" required>
    </div>

    <button class="pin-btn">✅ Update PIN</button>

  </form>

  <div class="message-box" th:if="${message}" th:text="${message}"></div>

  <a href="/dashboard" class="btn btn-light back-btn">⬅ Back to Dashboard</a>

  <div class="footer-note">
    ⚡ Safe • Encrypted • Instant Update
  </div>

</div>

</body>
</html>
