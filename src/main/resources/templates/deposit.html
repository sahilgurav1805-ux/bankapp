<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Premium Deposit</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
    }

    body{
        min-height:100vh;
        font-family:'Segoe UI',sans-serif;
        background:
          linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.78)),
          url('https://images.unsplash.com/photo-1579621970795-87facc2f976d?auto=format&fit=crop&w=1600&q=80');
        background-size:cover;
        background-position:center;
        display:flex;
        justify-content:center;
        align-items:center;
        padding:20px;
    }

    .deposit-box{
        width:100%;
        max-width:520px;
        background:rgba(15,23,42,0.92);
        border-radius:28px;
        padding:32px;
        color:white;
        box-shadow:0 25px 60px rgba(0,0,0,0.55);
        border:1px solid rgba(255,255,255,0.08);
    }

    .title{
        text-align:center;
        margin-bottom:8px;
        font-size:30px;
        font-weight:800;
        color:#4ade80;
    }

    .subtitle{
        text-align:center;
        color:#cbd5e1;
        margin-bottom:22px;
    }

    .status{
        background:rgba(34,197,94,0.12);
        border:1px solid rgba(34,197,94,0.25);
        color:#bbf7d0;
        padding:12px;
        border-radius:14px;
        text-align:center;
        margin-bottom:22px;
        font-weight:600;
    }

    .form-label{
        color:#e2e8f0;
        font-weight:600;
        margin-bottom:8px;
    }

    .form-control{
        background:#0f172a;
        border:1px solid #334155;
        color:white;
        border-radius:14px;
        padding:12px;
    }

    .form-control:focus{
        background:#0f172a;
        color:white;
        border-color:#22c55e;
        box-shadow:0 0 0 0.2rem rgba(34,197,94,0.15);
    }

    .deposit-btn{
        width:100%;
        border:none;
        padding:14px;
        border-radius:16px;
        font-size:17px;
        font-weight:700;
        background:linear-gradient(135deg,#16a34a,#22c55e);
        color:white;
        margin-top:8px;
        transition:0.25s ease;
    }

    .deposit-btn:hover{
        transform:translateY(-2px);
    }

    .back-btn{
        width:100%;
        margin-top:12px;
        border-radius:16px;
        padding:12px;
        font-weight:700;
    }

    .message{
        margin-top:16px;
        text-align:center;
        font-weight:700;
    }

    .balance-box{
        margin-top:18px;
        background:rgba(59,130,246,0.12);
        border:1px solid rgba(59,130,246,0.2);
        padding:14px;
        border-radius:16px;
        text-align:center;
    }

    .footer-note{
        text-align:center;
        color:#94a3b8;
        font-size:13px;
        margin-top:18px;
    }
  </style>
</head>

<body>

<div class="deposit-box">

  <div class="title">💰 Deposit Cash</div>
  <div class="subtitle">Secure ATM Deposit Terminal</div>

  <div class="status">
    💳 Session Active • Ready to Accept Deposit
  </div>

  <form action="/deposit" method="post">

    <div class="mb-3">
      <label class="form-label">Account Number</label>
      <input type="number" name="accountNumber" class="form-control" placeholder="Enter account number" required>
    </div>

    <div class="mb-3">
      <label class="form-label">PIN</label>
      <input type="password" name="pin" class="form-control" placeholder="Enter secure PIN" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Amount</label>
      <input type="number" name="amount" class="form-control" placeholder="Enter deposit amount" required>
    </div>

    <button class="deposit-btn">✅ Deposit Now</button>

  </form>

  <p class="message text-danger"
     th:if="${error}"
     th:text="${error}"></p>

  <p class="message text-success"
     th:if="${success}"
     th:text="${success}"></p>

  <div class="balance-box" th:if="${balance}">
    <h5 class="mb-1">Updated Balance</h5>
    <h3>₹<span th:text="${balance}"></span></h3>
  </div>

  <a href="/dashboard" class="btn btn-light back-btn">⬅ Back to Dashboard</a>

  <div class="footer-note">
    ⚡ Fast • Safe • Instant Credit
  </div>

</div>

</body>
</html>
