<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Premium View Account</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
    }

    body{
        min-height:100vh;
        font-family:'Segoe UI',sans-serif;
        background:
          linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.78)),
          url('https://images.unsplash.com/photo-1563013544-824ae1b704d3?auto=format&fit=crop&w=1600&q=80');
        background-size:cover;
        background-position:center;
        padding:25px 15px;
        display:flex;
        align-items:center;
        justify-content:center;
    }

    .account-box{
        width:100%;
        max-width:620px;
        background:rgba(15,23,42,0.94);
        border-radius:28px;
        padding:32px;
        color:white;
        box-shadow:0 25px 60px rgba(0,0,0,0.55);
        border:1px solid rgba(255,255,255,0.08);
    }

    .title{
        text-align:center;
        font-size:32px;
        font-weight:800;
        color:#38bdf8;
        margin-bottom:6px;
    }

    .subtitle{
        text-align:center;
        color:#cbd5e1;
        margin-bottom:22px;
    }

    .status{
        background:rgba(56,189,248,0.12);
        border:1px solid rgba(56,189,248,0.25);
        color:#bfdbfe;
        padding:12px;
        border-radius:14px;
        text-align:center;
        margin-bottom:22px;
        font-weight:600;
    }

    .form-control{
        background:#0f172a;
        border:1px solid #334155;
        color:white;
        border-radius:14px;
        padding:12px;
    }

    .search-btn{
        width:100%;
        border:none;
        padding:14px;
        border-radius:16px;
        font-size:17px;
        font-weight:700;
        background:linear-gradient(135deg,#0284c7,#38bdf8);
        color:white;
        margin-top:12px;
    }

    .error{
        text-align:center;
        margin-top:16px;
        font-weight:700;
    }

    .details{
        margin-top:22px;
        background:rgba(255,255,255,0.04);
        border:1px solid rgba(255,255,255,0.08);
        border-radius:18px;
        padding:20px;
    }

    .details p{
        margin-bottom:12px;
        font-size:17px;
    }

    .details span{
        color:#86efac;
        font-weight:700;
    }

    .back-btn{
        width:100%;
        margin-top:16px;
        border-radius:16px;
        padding:12px;
        font-weight:700;
    }
  </style>
</head>

<body>

<div class="account-box">

  <div class="title">👤 View Account</div>
  <div class="subtitle">Secure Customer Profile Access</div>

  <div class="status">
    💳 Account Lookup Service Active
  </div>

  <form action="/viewAccount" method="post">
    <input type="number"
           name="accountNumber"
           class="form-control"
           placeholder="Enter Account Number"
           required>

    <button type="submit" class="search-btn">🔍 Search Account</button>
  </form>

  <p class="error text-danger"
     th:if="${error}"
     th:text="${error}"></p>

  <div class="details" th:if="${account != null}">
    <p>👤 Name: <span th:text="${account.name}"></span></p>
    <p>💰 Balance: ₹<span th:text="${account.balance}"></span></p>
    <p>📱 Mobile: <span th:text="${account.mobile}"></span></p>
  </div>

  <a href="/dashboard" class="btn btn-light back-btn">⬅ Back to Dashboard</a>

</div>

</body>
</html>
