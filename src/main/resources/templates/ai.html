<!DOCTYPE html>
<html>
<head>
    <title>Premium AI Banking Assistant</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            min-height:100vh;
            font-family:'Segoe UI',sans-serif;
            background:
              linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.80)),
              url('https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=1600&q=80');
            background-size:cover;
            background-position:center;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:20px;
        }

        .chat-container{
            width:100%;
            max-width:460px;
            height:700px;
            background:rgba(15,23,42,0.94);
            border-radius:28px;
            display:flex;
            flex-direction:column;
            overflow:hidden;
            box-shadow:0 25px 60px rgba(0,0,0,0.55);
            border:1px solid rgba(255,255,255,0.08);
        }

        .header{
            background:linear-gradient(135deg,#2563eb,#7c3aed);
            color:white;
            padding:18px;
            font-size:22px;
            font-weight:800;
            text-align:center;
        }

        .sub-header{
            text-align:center;
            padding:10px;
            color:#cbd5e1;
            background:rgba(255,255,255,0.03);
            font-size:14px;
        }

        #chat{
            flex:1;
            padding:14px;
            overflow-y:auto;
        }

        .msg{
            padding:12px 14px;
            margin:10px 0;
            border-radius:18px;
            max-width:82%;
            word-wrap:break-word;
            line-height:1.4;
            font-size:15px;
        }

        .user{
            background:linear-gradient(135deg,#2563eb,#38bdf8);
            color:white;
            margin-left:auto;
            border-bottom-right-radius:6px;
        }

        .bot{
            background:linear-gradient(135deg,#16a34a,#22c55e);
            color:#052e16;
            border-bottom-left-radius:6px;
        }

        .input-box{
            display:flex;
            gap:10px;
            padding:14px;
            background:#0b1220;
            border-top:1px solid rgba(255,255,255,0.06);
        }

        input{
            flex:1;
            padding:12px;
            border-radius:14px;
            border:1px solid #334155;
            background:#111827;
            color:white;
            outline:none;
        }

        input:focus{
            border-color:#38bdf8;
        }

        button{
            padding:12px 18px;
            border:none;
            background:linear-gradient(135deg,#2563eb,#7c3aed);
            color:white;
            border-radius:14px;
            cursor:pointer;
            font-weight:700;
        }

        .footer{
            text-align:center;
            font-size:12px;
            color:#94a3b8;
            padding:8px;
        }
    </style>
</head>

<body>

<div class="chat-container">

    <div class="header">🤖 AI Banking Assistant</div>
    <div class="sub-header">Ask about balance, account, savings, loans & more</div>

    <div id="chat">
        <div class="msg bot">👋 Welcome! How can I help with your banking today?</div>
    </div>

    <div class="input-box">
        <input type="text" id="msg" placeholder="Type your message...">
        <button onclick="send()">Send</button>
    </div>

    <div class="footer">⚡ Smart • Secure • Instant AI Support</div>

</div>

<script>
    async function send() {
        let input = document.getElementById("msg");
        let message = input.value;

        if (!message.trim()) return;

        let chat = document.getElementById("chat");

        chat.innerHTML += "<div class='msg user'>"+ message +"</div>";
        input.value = "";
        chat.scrollTop = chat.scrollHeight;

        let res = await fetch("/ai/chat", {
            method: "POST",
            headers: {
                "Content-Type": "text/plain"
            },
            body: message
        });

        let data = await res.text();

        chat.innerHTML += "<div class='msg bot'>🤖 " + data + "</div>";
        chat.scrollTop = chat.scrollHeight;
    }
</script>

</body>
</html>
