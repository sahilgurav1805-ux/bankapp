<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Premium Bank Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
    }

    body{
        min-height:100vh;
        font-family:'Segoe UI',sans-serif;
        background:
          linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.78)),
          url('https://images.unsplash.com/photo-1556742049-0cfed4f6a45d?auto=format&fit=crop&w=1600&q=80');
        background-size:cover;
        background-position:center;
        display:flex;
        justify-content:center;
        align-items:center;
        padding:20px;
    }

    .login-box{
        width:100%;
        max-width:460px;
        background:rgba(15,23,42,0.92);
        border-radius:28px;
        padding:34px;
        color:white;
        box-shadow:0 25px 60px rgba(0,0,0,0.55);
        border:1px solid rgba(255,255,255,0.08);
    }

    .brand{
        text-align:center;
        font-size:30px;
        font-weight:800;
        color:#38bdf8;
        margin-bottom:6px;
    }

    .subtitle{
        text-align:center;
        color:#cbd5e1;
        margin-bottom:22px;
    }

    .status{
        background:rgba(59,130,246,0.12);
        border:1px solid rgba(59,130,246,0.25);
        color:#bfdbfe;
        padding:12px;
        border-radius:14px;
        text-align:center;
        margin-bottom:22px;
        font-weight:600;
    }

    .form-label{
        color:#e2e8f0;
        font-weight:600;
        margin-bottom:8px;
    }

    .form-control{
        background:#0f172a;
        border:1px solid #334155;
        color:white;
        border-radius:14px;
        padding:12px;
    }

    .form-control:focus{
        background:#0f172a;
        color:white;
        border-color:#38bdf8;
        box-shadow:0 0 0 0.2rem rgba(56,189,248,0.15);
    }

    .login-btn{
        width:100%;
        border:none;
        padding:14px;
        border-radius:16px;
        font-size:17px;
        font-weight:700;
        background:linear-gradient(135deg,#2563eb,#38bdf8);
        color:white;
        margin-top:10px;
        transition:0.25s ease;
    }

    .login-btn:hover{
        transform:translateY(-2px);
    }

    .create-link{
        display:block;
        text-align:center;
        margin-top:18px;
        color:#93c5fd;
        text-decoration:none;
        font-weight:600;
    }

    .create-link:hover{
        color:white;
    }

    .footer-note{
        text-align:center;
        color:#94a3b8;
        font-size:13px;
        margin-top:18px;
    }
  </style>
</head>

<body>

<div class="login-box">

  <div class="brand">🏦 UNION AI BANK</div>
  <div class="subtitle">Secure Customer Login Portal</div>

  <div class="status">
    🔒 Protected Login • Encrypted Banking Access
  </div>

  <form action="/login" method="post">

    <div class="mb-3">
      <label class="form-label">Account Number</label>
      <input type="number" name="accountNumber" class="form-control" placeholder="Enter account number" required>
    </div>

    <div class="mb-3">
      <label class="form-label">PIN</label>
      <input type="password" name="pin" class="form-control" placeholder="Enter secure PIN" required>
    </div>

    <button type="submit" class="login-btn">🔓 Login</button>

  </form>

  <a href="/create" class="create-link">➕ Create New Account</a>

  <div class="footer-note">
    ⚡ Safe • Fast • Smart Banking
  </div>

</div>

</body>
</html>
