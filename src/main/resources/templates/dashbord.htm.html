<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Bank Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">

    <h2 class="text-center mb-4">Bank Dashboard</h2>

    <div class="row text-center">

        <div class="col-md-4">
            <div class="card p-3">
                <h5>Deposit</h5>
                <a href="/deposit-page" class="btn btn-success">Go</a>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card p-3">
                <h5>Withdraw</h5>
                <a href="/withdraw-page" class="btn btn-danger">Go</a>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card p-3">
                <h5>Statement</h5>
                <a href="/statement-page" class="btn btn-primary">Go</a>
            </div>
        </div>

    </div>

</div>

</body>
</html>
