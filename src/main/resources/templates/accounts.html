<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Premium All Accounts</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            min-height:100vh;
            font-family:'Segoe UI',sans-serif;
            background:
              linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.78)),
              url('https://images.unsplash.com/photo-1554224154-22dec7ec8818?auto=format&fit=crop&w=1600&q=80');
            background-size:cover;
            background-position:center;
            padding:25px 15px;
        }

        .main-box{
            max-width:1100px;
            margin:auto;
            background:rgba(15,23,42,0.94);
            border-radius:28px;
            padding:32px;
            color:white;
            box-shadow:0 25px 60px rgba(0,0,0,0.55);
            border:1px solid rgba(255,255,255,0.08);
        }

        .title{
            text-align:center;
            font-size:34px;
            font-weight:800;
            color:#38bdf8;
            margin-bottom:8px;
        }

        .subtitle{
            text-align:center;
            color:#cbd5e1;
            margin-bottom:22px;
        }

        .status{
            background:rgba(56,189,248,0.12);
            border:1px solid rgba(56,189,248,0.25);
            color:#bfdbfe;
            padding:12px;
            border-radius:14px;
            text-align:center;
            margin-bottom:24px;
            font-weight:600;
        }

        .table-box{
            overflow-x:auto;
        }

        table{
            color:white !important;
        }

        th{
            background:#1e293b !important;
            color:#38bdf8 !important;
            white-space:nowrap;
        }

        tbody tr{
            background:rgba(255,255,255,0.03);
        }

        tbody tr:hover{
            background:rgba(255,255,255,0.08);
        }

        .back-btn{
            width:100%;
            margin-top:18px;
            border-radius:16px;
            padding:12px;
            font-weight:700;
        }

        .footer{
            text-align:center;
            color:#94a3b8;
            font-size:13px;
            margin-top:18px;
        }
    </style>
</head>

<body>

<div class="main-box">

    <div class="title">🏦 All Bank Accounts</div>
    <div class="subtitle">Registered Customer Account Records</div>

    <div class="status">
        📊 Admin View Active • Live Database Accounts
    </div>

    <div class="table-box">
        <table class="table table-bordered table-hover">

            <thead>
            <tr>
                <th>ID</th>
                <th>Account Number</th>
                <th>Name</th>
                <th>Email</th>
                <th>Balance</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="acc : ${accounts}">
                <td th:text="${acc.id}"></td>
                <td th:text="${acc.accountNumber}"></td>
                <td th:text="${acc.name}"></td>
                <td th:text="${acc.email}"></td>
                <td>₹<span th:text="${acc.balance}"></span></td>
            </tr>
            </tbody>

        </table>
    </div>

    <a href="/" class="btn btn-light back-btn">⬅ Back Home</a>

    <div class="footer">
        ⚡ Smart • Secure • Real-Time Banking Data
    </div>

</div>

</body>
</html>
