<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Premium Transaction History</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
    }

    body{
        min-height:100vh;
        font-family:'Segoe UI',sans-serif;
        background:
          linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.78)),
          url('https://images.unsplash.com/photo-1554224154-26032ffc0d07?auto=format&fit=crop&w=1600&q=80');
        background-size:cover;
        background-position:center;
        padding:25px 15px;
    }

    .history-box{
        max-width:950px;
        margin:auto;
        background:rgba(15,23,42,0.94);
        border-radius:28px;
        padding:32px;
        color:white;
        box-shadow:0 25px 60px rgba(0,0,0,0.55);
        border:1px solid rgba(255,255,255,0.08);
    }

    .title{
        text-align:center;
        font-size:32px;
        font-weight:800;
        color:#60a5fa;
        margin-bottom:6px;
    }

    .subtitle{
        text-align:center;
        color:#cbd5e1;
        margin-bottom:22px;
    }

    .status{
        background:rgba(96,165,250,0.12);
        border:1px solid rgba(96,165,250,0.25);
        color:#bfdbfe;
        padding:12px;
        border-radius:14px;
        text-align:center;
        margin-bottom:22px;
        font-weight:600;
    }

    .form-control{
        background:#0f172a;
        border:1px solid #334155;
        color:white;
        border-radius:14px;
        padding:12px;
    }

    .form-control:focus{
        background:#0f172a;
        color:white;
        border-color:#60a5fa;
        box-shadow:0 0 0 0.2rem rgba(96,165,250,0.15);
    }

    .view-btn{
        width:100%;
        border:none;
        padding:14px;
        border-radius:16px;
        font-size:17px;
        font-weight:700;
        background:linear-gradient(135deg,#2563eb,#60a5fa);
        color:white;
        margin-top:12px;
    }

    .table-box{
        margin-top:24px;
        overflow-x:auto;
    }

    table{
        color:white !important;
    }

    th{
        background:#1e293b !important;
    }

    tbody tr{
        background:rgba(255,255,255,0.03);
    }

    .error{
        margin-top:18px;
        text-align:center;
        font-weight:700;
    }

    .back-btn{
        width:100%;
        margin-top:16px;
        border-radius:16px;
        padding:12px;
        font-weight:700;
    }

    .footer-note{
        text-align:center;
        color:#94a3b8;
        font-size:13px;
        margin-top:18px;
    }
  </style>
</head>

<body>

<div class="history-box">

  <div class="title">📜 Transaction History</div>
  <div class="subtitle">Complete Account Activity Records</div>

  <div class="status">
    💳 Transaction Service Active • Secure Audit Logs
  </div>

  <form action="/transactions" method="post">

    <input type="number"
           name="accountNumber"
           class="form-control"
           placeholder="Enter Account Number"
           required>

    <button class="view-btn">📑 Get History</button>

  </form>

  <p class="error text-danger"
     th:if="${error}"
     th:text="${error}"></p>

  <div class="table-box">
    <table class="table table-bordered table-hover mt-4" th:if="${transactions}">
      <tr>
        <th>Type</th>
        <th>Amount</th>
        <th>Balance After</th>
        <th>Date</th>
      </tr>

      <tr th:each="t : ${transactions}">
        <td th:text="${t.type}"></td>
        <td>₹<span th:text="${t.amount}"></span></td>
        <td>₹<span th:text="${t.balanceAfter}"></span></td>
        <td th:text="${t.dateTime}"></td>
      </tr>
    </table>
  </div>

  <a href="/dashboard" class="btn btn-light back-btn">⬅ Back to Dashboard</a>

  <div class="footer-note">
    ⚡ Fast • Accurate • Secure Banking Records
  </div>

</div>

</body>
</html>
